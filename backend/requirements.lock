# requirements.lock —— 本机实测通过的**完整**依赖快照（含传递依赖）。
#
# 用途：复现「我这边跑得动」的那个版本组合。
# 用法：pip install -r requirements.lock
#
# 与 requirements.txt 的分工：
#   * requirements.txt  —— 只声明**直接**依赖 + 允许范围，给人看、给 CI 做宽松安装。
#   * requirements.lock —— pip freeze 出来的**精确**版本，给「装出来必须一模一样」的场景。
#
# 为什么需要它：范围钉版挡不住传递依赖的破坏性升级。
# Q6 的坑就是这么来的 —— faster-whisper 只声明 `av>=11` 没有上限，pip 装到 av 19.0.0，
# 而它调用 `av.open(..., metadata_errors=...)`，该参数在 PyAV 19 被删，直接 TypeError。
# 现在这里钉着 av==18.1.0（实测正常）。
#
# 重新生成（在本机 venv 里跑通全量测试之后）：
#   ../.venv/bin/python -m pip freeze --exclude-editable > requirements.lock
#
# 注意：playwright 只为「真实浏览器端到端测试」存在（KNOWLEDGEFLOW_BROWSER_TEST=1），
# 不跑那条测试的话装不装都行。

